<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>German Article Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --maroon-bg: #3B0000;
            --maroon-card: #5A0000;
            --gold: #F5EE22;
            --gold-hover: #F1D570;
            --dull-orange: #C47F35;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', Georgia, serif;
            background-color: var(--maroon-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--gold);
        }

        .card {
            background-color: var(--maroon-card);
            /* "Swoopy" alternating border radius */
            border-radius: 50px 10px 50px 10px;
            /* Fancy double gold trim using border and inset shadow */
            border: 3px solid var(--gold);
            box-shadow: 
                inset 0 0 0 6px var(--maroon-card), 
                inset 0 0 0 8px var(--gold), 
                0 15px 30px rgba(0, 0, 0, 0.6);
            padding: 50px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
        }

        #word {
            font-size: 36px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 8px;
            min-height: 42px;
            letter-spacing: 1px;
        }

        #translation {
            font-size: 18px;
            font-style: italic;
            color: var(--dull-orange);
            margin-bottom: 35px;
            min-height: 22px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap; /* Helps with very small mobile screens */
        }

        button {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 18px;
            font-weight: bold;
            background-color: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            /* Matching swoopy shape for buttons */
            border-radius: 20px 5px 20px 5px;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 90px;
        }

        button:hover {
            background-color: var(--gold);
            color: var(--maroon-card);
            border-color: var(--gold-hover);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            background-color: transparent;
            color: var(--gold);
        }

        #feedback {
            font-size: 18px;
            min-height: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .correct { color: #50C878; } /* Emerald green to contrast maroon */
        .incorrect { color: #FF6347; } /* Tomato red */
        .warning { color: var(--dull-orange); font-weight: normal; font-size: 14px; margin-top: 20px; }
        
        /* Mobile optimization */
        @media (max-width: 480px) {
            .card {
                padding: 40px 20px;
            }
            #word {
                font-size: 28px;
            }
            button {
                padding: 10px 20px;
                font-size: 16px;
                flex: 1; /* Allow buttons to grow evenly */
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="word">Loading...</div>
        <div id="translation"></div>
        
        <div class="button-container">
            <button id="btn-der" onclick="checkAnswer('der')">der</button>
            <button id="btn-die" onclick="checkAnswer('die')">die</button>
            <button id="btn-das" onclick="checkAnswer('das')">das</button>
        </div>

        <div id="feedback"></div>
    </div>

    <script>
        let vocabulary = [];
        let recentWords = [];
        let currentWordData = null;
        let isWaiting = false;
        let cooldownSize = 0;

        const wordEl = document.getElementById('word');
        const translationEl = document.getElementById('translation');
        const feedbackEl = document.getElementById('feedback');

        // Initialization
        async function initGame() {
            try {
                // Fetch the text file from the server/repository
                const response = await fetch('german_words.txt');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const text = await response.text();
                parseVocabulary(text);
            } catch (error) {
                console.error("Could not load german_words.txt:", error);
                // Fallback for local testing without a web server
                const fallbackData = "der Apfel Apple\ndie Frau Woman\ndas Haus House\nder Baum Tree\ndie Katze Cat\ndas Auto Car\nder Hund Dog\ndie Sonne Sun\ndas Buch Book";
                parseVocabulary(fallbackData);
                feedbackEl.className = 'warning';
                feedbackEl.textContent = "Running offline: loaded sample words instead of german_words.txt.";
            }

            if (vocabulary.length > 0) {
                cooldownSize = calculateCooldownSize(vocabulary.length);
                nextWord();
            } else {
                wordEl.textContent = "No valid words found.";
            }
        }

        function parseVocabulary(text) {
            const lines = text.split('\n');
            for (let line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                
                // Split by spaces, allowing multiple spaces for the translation part
                const parts = trimmed.split(/\s+/);
                if (parts.length >= 3) {
                    vocabulary.push({
                        article: parts[0].toLowerCase(),
                        word: parts[1],
                        // Join remaining parts to support multi-word translations if underscores aren't used
                        translation: parts.slice(2).join(' ') 
                    });
                }
            }
        }

        function calculateCooldownSize(totalWords) {
            if (totalWords <= 1) return 0;
            if (totalWords === 2) return 1;
            if (totalWords < 30) return Math.round(1 + (11 / 28) * (totalWords - 2));
            return Math.floor(0.4 * totalWords);
        }

        function nextWord() {
            isWaiting = false;
            feedbackEl.textContent = "";
            feedbackEl.className = "";

            if (vocabulary.length === 0) return;

            // Filter out recently used words
            let availableChoices = vocabulary.filter(item => !recentWords.includes(item.word));

            // Fallback if the calculation empties the list
            if (availableChoices.length === 0) {
                availableChoices = vocabulary;
            }

            // Pick random word
            const randomIndex = Math.floor(Math.random() * availableChoices.length);
            currentWordData = availableChoices[randomIndex];

            // Manage cooldown tracker
            recentWords.push(currentWordData.word);
            while (recentWords.length > cooldownSize) {
                recentWords.shift(); // Remove oldest word
            }

            // Update UI
            wordEl.textContent = currentWordData.word;
            translationEl.textContent = currentWordData.translation.replace(/_/g, ' '); // Cleans up underscores for display
        }

        function checkAnswer(guessedArticle) {
            if (isWaiting || !currentWordData) return;
            isWaiting = true;

            let delay;

            if (guessedArticle === currentWordData.article) {
                feedbackEl.textContent = "Correct!";
                feedbackEl.className = "correct";
                delay = 800;
            } else {
                feedbackEl.textContent = `Incorrect. It is '${currentWordData.article} ${currentWordData.word}'.`;
                feedbackEl.className = "incorrect";
                delay = 2000;
            }

            setTimeout(nextWord, delay);
        }

        // Start the application
        initGame();
    </script>
</body>
</html>
